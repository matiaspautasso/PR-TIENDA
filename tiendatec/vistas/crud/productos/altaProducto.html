<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alta de producto</title>
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
  <h1>Formulario de alta de producto</h1>
  <h2>TIENDA TECH</h2>
  <div id="nav-container"></div>
  <h3>Alta producto</h3>
  <form id="form-alta-producto" enctype="multipart/form-data">
    <label>Nombre
      <input type="text" name="nombre" required>
    </label>
    <label>Precio
      <input type="number" name="precio" min="0" step="0.01" required>
    </label>
    <label>Stock
      <input type="number" name="stock" min="0" step="1" required>
    </label>
    <label>Imagen
      <input type="file" name="imagen" accept="image/*" required>
    </label>
    <input type="submit" value="Dar de alta">
  </form>
  <div id="mensaje"></div>
  <script type="module">
    import { insertNav } from '../js/nav.js';
    insertNav();
    import { altaProducto } from './js/altaProducto.js';
    altaProducto();
  </script>
</body>
</html>
