<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TiendaTec</title>
    <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <div class="header-brand">
                <span class="logo">⚡</span>
                <h1>TiendaTec</h1>
            </div>
            <button id="btn-nuevo" class="btn btn-primary">+ Nuevo producto</button>
        </div>
    </header>

    <main class="main">
        <section class="filtros">
            <input type="text" id="buscar" class="input-buscar" placeholder="Buscar por nombre...">
            <select id="filtro-categoria" class="select-filtro">
                <option value="">Todas las categorías</option>
            </select>
            <select id="filtro-estado" class="select-filtro">
                <option value="">Todos los estados</option>
                <option value="activo">Activo</option>
                <option value="inactivo">Inactivo</option>
            </select>
            <span id="contador" class="contador"></span>
        </section>

        <div id="feedback" class="feedback hidden" role="alert"></div>

        <section id="grilla" class="grilla"></section>
    </main>

    <!-- Panel formulario -->
    <div id="overlay" class="overlay hidden">
        <div class="panel">
            <div class="panel-header">
                <h2 id="panel-titulo">Nuevo producto</h2>
                <button id="btn-cerrar-panel" class="btn-icon" aria-label="Cerrar">✕</button>
            </div>
            <form id="form-producto" novalidate>
                <input type="hidden" id="f-id">
                <div class="campo">
                    <label for="f-nombre">Nombre *</label>
                    <input type="text" id="f-nombre" placeholder="Ej: Laptop Dell XPS 15">
                    <span class="campo-error" id="err-nombre"></span>
                </div>
                <div class="campo">
                    <label for="f-descripcion">Descripción</label>
                    <textarea id="f-descripcion" rows="3" placeholder="Descripción del producto..."></textarea>
                </div>
                <div class="campo-row">
                    <div class="campo">
                        <label for="f-precio">Precio ($) *</label>
                        <input type="number" id="f-precio" step="0.01" min="0.01" placeholder="0.00">
                        <span class="campo-error" id="err-precio"></span>
                    </div>
                    <div class="campo">
                        <label for="f-stock">Stock *</label>
                        <input type="number" id="f-stock" min="0" placeholder="0">
                        <span class="campo-error" id="err-stock"></span>
                    </div>
                </div>
                <div class="campo-row">
                    <div class="campo">
                        <label for="f-categoria">Categoría</label>
                        <input type="text" id="f-categoria" placeholder="Ej: Laptops">
                    </div>
                    <div class="campo">
                        <label for="f-estado">Estado *</label>
                        <select id="f-estado">
                            <option value="activo">Activo</option>
                            <option value="inactivo">Inactivo</option>
                        </select>
                        <span class="campo-error" id="err-estado"></span>
                    </div>
                </div>
                <div class="campo">
                    <label for="f-imagen">Imagen</label>
                    <input type="file" id="f-imagen" accept="image/*">
                    <span class="campo-hint" id="hint-imagen"></span>
                </div>
                <div class="panel-acciones">
                    <button type="submit" class="btn btn-primary" id="btn-guardar">Guardar</button>
                    <button type="button" id="btn-cancelar" class="btn btn-secondary">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Panel detalle -->
    <div id="overlay-detalle" class="overlay hidden">
        <div class="panel">
            <div class="panel-header">
                <h2>Detalle del producto</h2>
                <button id="btn-cerrar-detalle" class="btn-icon" aria-label="Cerrar">✕</button>
            </div>
            <div id="detalle-contenido"></div>
        </div>
    </div>

    <script type="module" src="/js/app.js"></script>
</body>
</html>
